<style>
:root{
  --bg:#f4fbff; --card:#ffffff; --line:#d7e5ef; --muted:#5b7285; --text:#10212f;
  --blue:#0ea5e9; --blue2:#38bdf8; --chip:#eef8ff; --soft:#f8fcff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(14,165,233,.18), transparent 55%),
    radial-gradient(1000px 600px at 100% 0%, rgba(2,132,199,.10), transparent 50%),
    var(--bg);
}
.wrap{max-width:1600px; margin:0 auto; padding:20px 16px 28px;}
.head,.panel,.chartCard{
  background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:18px;
  backdrop-filter: blur(8px); box-shadow:0 10px 28px rgba(15,23,42,.05);
}
.head{padding:18px; margin-bottom:14px;}
.headTop{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;}
h1{margin:0; font-size:28px; letter-spacing:.2px}
.sub{margin:8px 0 0; color:var(--muted)}
.note{margin:10px 0 0; color:var(--muted); font-size:12px}
.headActions{display:flex; gap:8px; flex-wrap:wrap;}
button{
  border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text);
  padding:10px 12px; font:inherit; cursor:pointer;
}
button:hover{border-color:#b9d6e6; background:#fcfeff}
button.primary{background:linear-gradient(180deg, rgba(56,189,248,.16), rgba(14,165,233,.08)); border-color:#b5e7fb; color:#065f8f; font-weight:700}
.layout{display:grid; grid-template-columns:1fr; gap:14px;}
@media (max-width: 1080px){ .metrics{grid-template-columns:repeat(2,minmax(0,1fr));} }
.panel{padding:14px;}
.sectionTitle{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:2px 0 8px;}
.metrics{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px;}
.metric{padding:12px; border:1px solid #e7f1f7; border-radius:14px; background:var(--soft);}
.metricLabel{color:var(--muted); font-size:12px;}
.metricValue{margin-top:4px; font-size:22px; font-weight:800; letter-spacing:.2px}
.filterBox{margin-top:14px; padding-top:14px; border-top:1px solid #edf4f8;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; background:var(--chip); border:1px solid #d6efff; color:#065f8f; font-size:12px;}
.muted{color:var(--muted)}
.dimList{display:flex; flex-wrap:wrap; gap:10px;}
.dimItem{flex:0 1 calc(33.333% - 7px); min-width:220px; max-width:100%; display:flex; align-items:flex-start; gap:8px; padding:10px 12px; border:1px solid #e7f1f7; border-radius:14px; background:#fbfeff;}
@media (max-width: 1120px){ .dimItem{flex-basis:calc(50% - 5px);} }
@media (max-width: 720px){ .dimItem{flex-basis:100%; min-width:0;} }
.dimItem input{margin-top:2px}
.dimItem label{display:flex; flex-direction:column; gap:2px; cursor:pointer}
.dimItem small{color:var(--muted)}
.chartCard{padding:12px; overflow:hidden; margin-top:18px;}
.toolbar{display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin-bottom:10px;}
.toolbarTop{display:flex; width:100%; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
.toolbarMeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.badge{display:inline-flex; align-items:center; padding:5px 10px; border-radius:999px; background:var(--chip); color:#065f8f; border:1px solid #d6efff; font-size:12px;}
.legend{display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:12px;}
.legendDot{width:10px; height:10px; border-radius:50%; background:linear-gradient(180deg, rgba(125,211,252,.95), rgba(14,165,233,.95)); display:inline-block; vertical-align:middle; margin-right:6px}
.chartWrap{position:relative; overflow-x:auto; overflow-y:hidden; height:auto; min-height:0; max-height:none; border:1px solid #e7f1f7; border-radius:16px; background:linear-gradient(180deg, rgba(252,254,255,.98), rgba(246,251,255,.94));}
#chartSvg{display:block; width:100%; min-width:760px}
.tooltip{
  position:fixed; z-index:50; min-width:160px; max-width:300px; padding:10px 12px; border-radius:14px;
  background:rgba(16,33,47,.96); color:#fff; box-shadow:0 12px 28px rgba(15,23,42,.22);
  font-size:12px; line-height:1.35; pointer-events:none; opacity:0; transform:translate(12px, 12px);
  transition:opacity .12s ease;
}
.tooltip.show{opacity:1}
.tooltipTitle{font-weight:800; font-size:13px; letter-spacing:.15px}
.tooltipSub{margin-top:4px; color:rgba(255,255,255,.8)}
.empty{border:1px dashed var(--line); border-radius:16px; padding:28px 16px; text-align:center; color:var(--muted); background:#fbfeff;}
.node rect{fill:url(#nodeGrad); stroke:#b7e2f8; stroke-width:1; rx:8;}
.node text{font-size:12px; fill:#1c3142; dominant-baseline:middle; pointer-events:none}
.node .nodeMeta{fill:#5b7285; font-size:11px}
.node.is-dim rect{opacity:.2}
.node.is-active rect{stroke:#0284c7; stroke-width:1.4; filter:url(#nodeGlow)}
.link{fill:rgba(14,165,233,.28); stroke:none; transition:opacity .14s ease, fill .14s ease, filter .14s ease;}
.link.is-dim{opacity:.06 !important}
.link.is-active{fill:rgba(14,165,233,.72) !important;}
.axisLabel{font-size:13px; font-weight:800; fill:#2c4457;}
.axisSub{font-size:11px; fill:#6b7f90;}
.help{margin-top:10px; color:var(--muted); font-size:12px}
.error{color:#b42318}
.stacked{display:grid; gap:14px;}
.heightControl{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  width:100%; padding:8px 10px; border:1px solid #e7f1f7; border-radius:12px; background:#fbfeff;
}
.heightControl label{font-size:12px; color:var(--muted); font-weight:700}
.heightControl input[type="range"]{flex:1 1 260px; min-width:180px}
.heightControl span{font-size:12px; color:#065f8f; font-weight:700; min-width:44px; text-align:right}

.dimItem{position:relative}
.dimMain{display:flex; flex-direction:column; gap:2px; cursor:pointer}
.levelPill{display:inline-flex; align-items:center; gap:4px; margin-top:4px; padding:2px 7px; border-radius:999px; background:#eef8ff; border:1px solid #d6efff; color:#065f8f; font-size:11px; font-weight:700; width:max-content}
.levelPill::after{content:"▾"; font-size:10px; opacity:.72}
.levelMenu{display:none; position:absolute; left:38px; top:42px; z-index:20; min-width:156px; padding:6px; border:1px solid #cfe7f5; border-radius:12px; background:rgba(255,255,255,.98); box-shadow:0 12px 28px rgba(15,23,42,.12)}
.dimItem:hover .levelMenu, .dimItem:focus-within .levelMenu{display:block}
.levelMenu button{display:block; width:100%; text-align:left; padding:7px 9px; border:0; border-radius:9px; background:transparent; font-size:12px}
.levelMenu button:hover{background:#eef8ff}
.levelMenu button.active{background:#dff3ff; color:#065f8f; font-weight:800}
.dimItem{transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease}
.dimItem[draggable="true"]{cursor:grab}
.dimItem.dragging{opacity:.55; transform:scale(.985); box-shadow:0 12px 26px rgba(15,23,42,.14); border-color:#8fd8f7}
.dimItem.drag-over{outline:2px dashed rgba(14,165,233,.45); outline-offset:2px; background:#f2fbff}

.groupBrace path{fill:none; stroke:#6b7f90; stroke-width:1.2; opacity:.88}
.groupBrace text{font-size:11px; fill:#486174; font-weight:800; dominant-baseline:middle}
.groupBrace.is-empty{display:none}
</style>

      </div>
      <div id="emptyBox" class="empty hidden" style="display:none"></div>
    </main>
  </div>
</div>

function humanizeCode(value){
  const raw = norm(value);
  if(!raw) return lang === "zh" ? "（空）" : "(Empty)";
  return raw.replace(/_/g, " ").replace(/\bmcd(r)?\b/ig, "mCDR").replace(/\bco2\b/ig, "CO₂").replace(/\bmrv\b/ig, "MRV").replace(/^./, c => c.toUpperCase());
}
function displayControlledValue(value){
  const raw = norm(value);
  if(!raw || raw === "（空）") return lang === "zh" ? "（空）" : "(Empty)";
  if(lang === "zh") return CONTROLLED_LABELS_ZH[raw] || maybeTranslate(raw) || raw;
  return CONTROLLED_LABELS_EN[raw] || humanizeCode(VALUE_MAP_EN[raw] || raw);
}
function valuesOf(value){
  if(Array.isArray(value)) return value.map(norm).filter(Boolean);
  const raw = norm(value);
  if(!raw) return [];
  return raw.split(";").map(norm).filter(Boolean);
}
function displayField(value){
  const vals = valuesOf(value);
  return vals.length ? vals.map(displayControlledValue).join(lang === "zh" ? "；" : "; ") : "—";
}

  return y >= Number(state.minYear) && y <= Number(state.maxYear);
}
function selectionMatchesRowValue(selectedValues, row, key){
  if(!selectedValues || !selectedValues.length) return true;
  const vals = rawValuesForField(row, key);
  const labels = new Set();
  vals.forEach(raw => { labels.add(norm(raw)); labels.add(norm(displayControlledValue(raw))); });
  return selectedValues.some(v => labels.has(norm(v)) || labels.has(norm(displayControlledValue(v))));
}

function rowMatchesSelections(r){
  const selections = stateSelections();
  for(const key of FILTERS){
    const vals = selections.get(key) || [];
    if(!vals.length) continue;
    if(!selectionMatchesRowValue(vals, r, key)) return false;
  }
  return true;
}
function validateOnceSchema(data){
  if(!Array.isArray(data) || !data.length) throw new Error('data.json must be a non-empty array');
  const first = data[0] || {};
  const missing = REQUIRED_ONCE_FIELDS.filter(key => !Object.prototype.hasOwnProperty.call(first, key));
  if(missing.length) throw new Error(`data.json字段不匹配 / schema mismatch: ${missing.join(', ')}`);
  return data;
}

async function loadData(){
  const candidates = [];
  if(state?.loadedPath && /data\.json(?:$|[?#])/.test(String(state.loadedPath))) candidates.push(state.loadedPath);
  DATA_CANDIDATES.forEach(p => { if(!candidates.includes(p)) candidates.push(p); });
  let lastError = null;
  for(const path of candidates){
    try{
      const res = await fetch(path, {cache:'no-store'});
      if(!res.ok) continue;
      const data = validateOnceSchema(await res.json());
      loadedPath = path;
      return data;
    }catch(err){ lastError = err; }
  }
  throw lastError || new Error('No available ONCE data file');
}

function attachDimDragHandlers(){
  let draggedKey = null;
  el.dimList.querySelectorAll('.dimItem').forEach(item => {
    item.addEventListener('dragstart', e => {
      if(e.target.closest('input, button, .levelMenu, .levelPill')){
        e.preventDefault();
        return;
      }
      draggedKey = item.dataset.key;
      item.classList.add('dragging');
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedKey || '');
      }
    });
    item.addEventListener('dragover', e => {
      if(!draggedKey || draggedKey === item.dataset.key) return;
      e.preventDefault();
      item.classList.add('drag-over');
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const targetKey = item.dataset.key;
      if(!draggedKey || !targetKey || draggedKey === targetKey) return;
      const next = dimOrder.filter(k => k !== draggedKey);
      const targetIndex = next.indexOf(targetKey);
      if(targetIndex >= 0) next.splice(targetIndex, 0, draggedKey);
      dimOrder = [...next, ...FILTERS.filter(k => !next.includes(k))];
      normalizeActiveDimsToDimOrder();
      saveDimOrder();
      renderDimControls();
      renderChart();
    });
    item.addEventListener('dragend', () => {
      draggedKey = null;
      el.dimList.querySelectorAll('.dimItem').forEach(elm => elm.classList.remove('dragging','drag-over'));
    });
  });

function groupRowsByDimension(rows, key){
  const counts = new Map();
  rows.forEach(r => {
    const vals = getValues(r, key);
    const weight = vals.length ? 1 / vals.length : 1;
    vals.forEach(val => counts.set(val, (counts.get(val) || 0) + weight));
  });
  return Array.from(counts.entries()).map(([label, value]) => ({ label, value }));
}
function sortDimensionItems(key, a, b){
  const pa = parentInfoForLabel(key, a.label);
  const pb = parentInfoForLabel(key, b.label);
  if(pa && pb){
    return pa.groupIndex - pb.groupIndex || pa.childIndex - pb.childIndex || b.value - a.value || String(a.label).localeCompare(String(b.label), lang === 'zh' ? 'zh-CN' : 'en');
  }
  if(pa || pb) return pa ? -1 : 1;
  return b.value - a.value || String(a.label).localeCompare(String(b.label), lang === 'zh' ? 'zh-CN' : 'en');
}
function buildSankeyData(dims){
  const nodes = [];
  const nodeMap = new Map();
  const columns = [];
  dims.forEach((dimKey, depth) => {
    const columnNodes = groupRowsByDimension(filteredRows, dimKey)
      .sort((a,b) => sortDimensionItems(dimKey, a, b))
      .map((item, index) => {
        const parent = parentInfoForLabel(dimKey, item.label);
        const node = {
          id: `${depth}__${item.label}`,
          key: dimKey,
          groupLabel: dimDisplayLabel(dimKey),
          parentLabel: parent?.label || '',
          parentKey: parent?.key || '',
          parentOrder: parent?.groupIndex ?? 999,
          depth,
          order: index,
          label: item.label,
          value: item.value
        };
        nodes.push(node);
        nodeMap.set(node.id, node);
        return node;
      });
    columns.push({ key: dimKey, label: dimDisplayLabel(dimKey), nodes: columnNodes });
  });

  const links = [];
  for(let i = 0; i < dims.length - 1; i++){
    const left = dims[i], right = dims[i+1];
    const pairMap = new Map();
    filteredRows.forEach(r => {
      const sourceLabels = getValues(r, left);
      const targetLabels = getValues(r, right);
      const weight = 1 / Math.max(1, sourceLabels.length * targetLabels.length);
      sourceLabels.forEach(sourceLabel => {
        targetLabels.forEach(targetLabel => {
          const sourceId = `${i}__${sourceLabel}`;
          const targetId = `${i+1}__${targetLabel}`;
          const k = `${sourceId}|||${targetId}`;
          pairMap.set(k, (pairMap.get(k) || 0) + weight);
        });
      });
    });
    Array.from(pairMap.entries())
      .map(([k, value]) => {
        const [sourceId, targetId] = k.split('|||');
        return { sourceId, targetId, value, depth: i };
      })
      .sort((a,b) => (nodeMap.get(a.sourceId)?.order ?? 0) - (nodeMap.get(b.sourceId)?.order ?? 0) || (nodeMap.get(a.targetId)?.order ?? 0) - (nodeMap.get(b.targetId)?.order ?? 0))
      .forEach(link => links.push(link));
  }
  return { columns, nodes, links, nodeMap };
}

function layoutSankey(data, heightPercent){
  const scale = Math.max(12.5, Math.min(160, Number(heightPercent) || 12.5)) / 100;

  const labelBlockHeight = 32;
  const labelChartGap = 36;
  const margin = {
    top: labelBlockHeight + labelChartGap,
    right: 132,
    bottom: Math.max(10, Math.round(16 * scale)),
    left: 190
  };

  const width = Math.max(el.chartWrap?.clientWidth || 860, activeDims.length * 205 + 140);
  const maxNodeCount = Math.max(...data.columns.map(col => col.nodes.length), 1);
  const total = Math.max(...data.columns.map(col => col.nodes.reduce((acc, node) => acc + node.value, 0)), 1);

  // This is the TRUE body height of the sankey, directly scaled by the slider.
  const naturalBodyHeight = Math.max(240, Math.min(760, maxNodeCount * 16 + 64));
  const targetBodyHeight = Math.max(36, Math.round(naturalBodyHeight * scale));

  const nodeGap = Math.max(1, Math.round(2 * scale));
  const groupGap = Math.max(10, Math.round(18 * scale));
  const nodeWidth = 12;
  const minNodeHeight = Math.max(1.2, 6 * scale);

  const innerWidth = width - margin.left - margin.right;
  const columnGap = activeDims.length > 1 ? innerWidth / (activeDims.length - 1) : 0;

  const ky = Math.max(0.18, Math.min(...data.columns.map(col => {
    const gaps = Math.max(0, col.nodes.length - 1) * nodeGap;
    const groupBreaks = col.nodes.reduce((acc, node, idx) => acc + (idx > 0 && node.parentKey && node.parentKey !== col.nodes[idx-1].parentKey ? 1 : 0), 0);
    return (targetBodyHeight - gaps - groupBreaks * groupGap) / total;
  })));

  let maxUsedY = 0;
  data.columns.forEach((col, colIndex) => {
    let y = margin.top;
    const x = margin.left + colIndex * columnGap;
    col.nodes.forEach((node, nodeIndex) => {
      if(nodeIndex > 0 && node.parentKey && node.parentKey !== col.nodes[nodeIndex - 1].parentKey) y += groupGap;
      const h = Math.max(minNodeHeight, node.value * ky);
      node.x0 = x;
      node.x1 = x + nodeWidth;
      node.y0 = y;
      node.y1 = y + h;
      y = node.y1 + nodeGap;
    });
    maxUsedY = Math.max(maxUsedY, y - nodeGap);
  });

  const height = Math.max(margin.top + margin.bottom + 40, Math.round(maxUsedY + margin.bottom));

  const sourceOffsets = new Map();
  const targetOffsets = new Map();
  data.links.forEach(link => {
    const source = data.nodeMap.get(link.sourceId);
    const target = data.nodeMap.get(link.targetId);
    const thickness = Math.max(Math.max(0.6, 1.8 * scale), link.value * ky);
    const sOff = sourceOffsets.get(link.sourceId) || 0;
    const tOff = targetOffsets.get(link.targetId) || 0;
    link.width = thickness;
    link.source = source;
    link.target = target;
    link.sy0 = source.y0 + sOff;
    link.sy1 = link.sy0 + thickness;
    link.ty0 = target.y0 + tOff;
    link.ty1 = link.ty0 + thickness;
    link.x0 = source.x1;
    link.x1 = target.x0;
    sourceOffsets.set(link.sourceId, sOff + thickness);
    targetOffsets.set(link.targetId, tOff + thickness);
  });

  return { width, height, margin, nodeWidth, ky, scale };
}
function pathForLink(link){
  const x0 = link.x0, x1 = link.x1;
  const dx = Math.max(20, x1 - x0);
  const curve = Math.min(44, dx * 0.22);
  return `M ${x0} ${link.sy0}
    C ${x0 + curve} ${link.sy0}, ${x1 - curve} ${link.ty0}, ${x1} ${link.ty0}
    L ${x1} ${link.ty1}
    C ${x1 - curve} ${link.ty1}, ${x0 + curve} ${link.sy1}, ${x0} ${link.sy1}
    Z`;
}

function bracePath(x, y0, y1){
  const mid = (y0 + y1) / 2;
  const w = 9;
  return `M ${x+w} ${y0} C ${x} ${y0}, ${x} ${y0}, ${x} ${y0+w} L ${x} ${mid-w} C ${x} ${mid}, ${x-w} ${mid}, ${x} ${mid+w} L ${x} ${y1-w} C ${x} ${y1}, ${x} ${y1}, ${x+w} ${y1}`;
}
function renderGroupBraces(columns){
  const braces = [];
  columns.forEach(col => {
    if(!PARENT_GROUPS[col.key]) return;
    const groups = [];
    col.nodes.forEach(node => {
      if(!node.parentKey) return;
      const last = groups[groups.length - 1];
      if(last && last.key === node.parentKey){
        last.y1 = node.y1;
        last.count += node.value;
      }else{
        groups.push({key:node.parentKey, label:node.parentLabel, y0:node.y0, y1:node.y1, count:node.value, x:node.x0});
      }
    });
    groups.forEach(g => {
      const x = g.x - 34;
      const tx = x - 8;
      const y0 = Math.max(66, g.y0 - 2);
      const y1 = Math.max(y0 + 14, g.y1 + 2);
      const mid = (y0 + y1) / 2;
      braces.push(`<g class="groupBrace"><path d="${bracePath(x, y0, y1)}"></path><text x="${tx}" y="${mid}" text-anchor="end">${escapeHtml(g.label)}</text></g>`);
    });
  });
  return braces.join('');
}

    return `
      <g class="node" data-id="${escapeHtml(node.id)}">
        <rect x="${node.x0}" y="${node.y0}" width="${layout.nodeWidth}" height="${Math.max(8, node.y1 - node.y0)}"></rect>
        <text x="${textX}" y="${centerY - 6}" text-anchor="${anchor}">${escapeHtml(node.label)}</text>
        <text class="nodeMeta" x="${textX}" y="${centerY + 10}" text-anchor="${anchor}">${escapeHtml(formatCount(node.value))}</text>
      </g>`;
  }).join('');

  svg.innerHTML = defs + axes + `<g class="groupBraces">${groupBraces}</g><g class="links">${links}</g><g class="nodes">${nodes}</g>`;

  svg.querySelectorAll('.node').forEach(nodeEl => {
    const id = nodeEl.dataset.id;
    const node = data.nodeMap.get(id);
    nodeEl.addEventListener('mouseenter', ev => {
      highlightNode(id);
      showTooltip(t().nodeTip(node.groupLabel, node.label, formatCount(node.value)), ev);
    });
    nodeEl.addEventListener('mousemove', ev => moveTooltip(ev));
    nodeEl.addEventListener('mouseleave', () => { clearHighlight(); hideTooltip(); });
  });
  svg.querySelectorAll('.link').forEach(linkEl => {
    const link = data.links[Number(linkEl.dataset.index)];
    linkEl.addEventListener('mouseenter', ev => {
      highlightLink(link.sourceId, link.targetId);
      showTooltip(t().linkTip(link.source.label, link.target.label, formatCount(link.value), link.source.groupLabel, link.target.groupLabel), ev);
    });
    linkEl.addEventListener('mousemove', ev => moveTooltip(ev));
    linkEl.addEventListener('mouseleave', () => { clearHighlight(); hideTooltip(); });
  });
}

async function exportChartPng(){
  const card = document.querySelector('.chartCard');
  if(!card) return;

  const prevLeft = el.chartWrap.scrollLeft;
  const prevTop = el.chartWrap.scrollTop;
  el.chartWrap.scrollLeft = 0;
  el.chartWrap.scrollTop = 0;

  try{
    if(typeof window.html2canvas !== 'function'){
      throw new Error('html2canvas not loaded');
    }

    const fullWidth = Math.max(
      card.scrollWidth,
      el.chartWrap ? el.chartWrap.scrollWidth + (el.chartWrap.offsetLeft || 0) + 16 : 0,
      Math.ceil(card.getBoundingClientRect().width)
    );
    const fullHeight = Math.max(
      card.scrollHeight,
      el.chartWrap ? el.chartWrap.scrollHeight + (el.chartWrap.offsetTop || 0) + 16 : 0,
      Math.ceil(card.getBoundingClientRect().height)
    );

    const canvas = await window.html2canvas(card, {
      backgroundColor: null,
      useCORS: true,
      allowTaint: true,
      scale: Math.max(2, window.devicePixelRatio || 1),
      width: fullWidth,
      height: fullHeight,
      windowWidth: fullWidth,
      windowHeight: fullHeight,
      scrollX: 0,
      scrollY: 0,
      onclone: (doc) => {
        const clonedCard = doc.querySelector('.chartCard');
        const clonedWrap = doc.querySelector('.chartWrap');
        const clonedSvg = doc.getElementById('chartSvg');
        if(clonedCard){
          clonedCard.style.overflow = 'visible';
          clonedCard.style.height = 'auto';
          clonedCard.style.maxHeight = 'none';
        }
        if(clonedWrap){
          clonedWrap.scrollLeft = 0;
          clonedWrap.scrollTop = 0;
          clonedWrap.style.overflow = 'visible';
          clonedWrap.style.height = 'auto';
          clonedWrap.style.maxHeight = 'none';
          clonedWrap.style.minHeight = clonedWrap.scrollHeight + 'px';
          clonedWrap.style.width = clonedWrap.scrollWidth + 'px';
          clonedWrap.style.maxWidth = 'none';
        }
        if(clonedSvg){
          const svgWidth = clonedSvg.width && clonedSvg.width.baseVal ? clonedSvg.width.baseVal.value : 0;
          const svgHeight = clonedSvg.height && clonedSvg.height.baseVal ? clonedSvg.height.baseVal.value : 0;
          if(svgWidth) clonedSvg.style.width = svgWidth + 'px';
          if(svgHeight) clonedSvg.style.height = svgHeight + 'px';
          clonedSvg.setAttribute('preserveAspectRatio', 'xMinYMin meet');
        }
      }
    });

    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
    a.href = canvas.toDataURL('image/png');
    a.download = `once-policy-sankey-${stamp}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch(err){
    console.error(err);
    alert(lang === 'zh'
      ? 'PNG 导出失败。现在已改成直接截图整个卡片内容；如果当前环境拦截了截图脚本，请刷新页面后再试。'
      : 'PNG export failed. It now uses a direct snapshot of the whole card; if the environment blocked the capture script, refresh the page and try again.');
  } finally {
    el.chartWrap.scrollLeft = prevLeft;
    el.chartWrap.scrollTop = prevTop;
  }
}

function applyFilterState(){
  filteredRows = rows.filter(r => rowMatchesSearch(r) && rowMatchesYear(r) && rowMatchesSelections(r));
  const years = filteredRows.map(r => parseYear(r.year)).filter(v => v !== null);
  el.metricRecords.textContent = String(filteredRows.length);
  el.metricYears.textContent = years.length ? `${Math.min(...years)} — ${Math.max(...years)}` : `${state.minYear} — ${state.maxYear}`;
  el.loadNote.textContent = t().loaded(filteredRows.length, loadedPath || state.loadedPath || t().untitledSource);
}
function syncActiveDims(){
  const usable = new Set(usableDimensions());
  activeDims = activeDims.filter(k => usable.has(k));
  if(activeDims.length < 2){
    determineInitialDims().forEach(k => { if(usable.has(k) && !activeDims.includes(k)) activeDims.push(k); });
    activeDims = activeDims.slice(0, 4);
  }
}
async function start(){
  state = readState();
  if(!state){
    applyTexts();
    el.loadNote.innerHTML = `<span class="error">${escapeHtml(t().loadMissing)}</span>`;
    el.contextChips.innerHTML = `<span class="muted">${escapeHtml(t().loadMissing)}</span>`;
    el.emptyBox.style.display = '';
    el.emptyBox.textContent = t().loadMissing;
    el.chartWrap.style.display = 'none';
    return;
  }
  lang = state.lang || 'zh';
  activeDimLevels = loadDimLevels();
  dimOrder = loadDimOrder();
  try{
    writeState(state);
  }catch(err){}
  applyTexts();
  applyHeightPercent(getHeightPercent());
  summarizeContext();
  rows = await loadData();
  applyFilterState();
  activeDims = determineInitialDims();
  syncActiveDims();
  placeActiveDimsFirstIfNoSavedOrder();
  normalizeActiveDimsToDimOrder();
  renderDimControls();
  renderChart();
}

if(el.langBtn){
  el.langBtn.addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    if(state){
      state.lang = lang;
      try{
        writeState(state);
      }catch(err){}
    }
    applyTexts();
    summarizeContext();
    renderDimControls();
    renderChart();
  });
}

el.backBtn.addEventListener('click', () => {
  if(document.referrer){
    history.back();
  }else{
    window.location.href = './index.html';
  }
});
el.reloadBtn.addEventListener('click', () => { start(); });
if(el.exportBtn){
  el.exportBtn.addEventListener('click', () => { exportChartPng().catch(console.error); });
}
if(el.heightSlider){
  el.heightSlider.addEventListener('input', () => {
    applyHeightPercent(el.heightSlider.value);
    renderChart();
  });
}
window.addEventListener('resize', () => {
  if(lastLayout){ renderChart(); }
});
start().catch(err => {
  applyTexts();
  el.loadNote.innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
  el.emptyBox.style.display = '';
  el.emptyBox.textContent = `${t().empty} (${err.message})`;
});
</script>
